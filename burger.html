<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talabat Home Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-container">
    <header class="app-header">
      <h1>talabat</h1>
      <p>Fast food delivery to your door</p>
    </header>

    <!-- Restaurant 1: Burger Republic -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80" alt="Burger Republic">
      <div class="card-body">
        <span class="badge">Top Rated • Burgers</span>
        <h2 class="card-title">Burger Republic</h2>
        <p class="card-desc">Juicy flame-grilled beef burgers, crispy fries, and signature sauces.</p>
        <a href="burger.html" class="btn">View Burger Menu</a>
      </div>
    </div>

    <!-- Restaurant 2: Napoli Woodfire Pizza -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&auto=format&fit=crop&q=80" alt="Napoli Woodfire Pizza">
      <div class="card-body">
        <span class="badge">Authentic • Italian</span>
        <h2 class="card-title">Napoli Woodfire Pizza</h2>
        <p class="card-desc">Hand-stretched sourdough pizzas baked in a traditional stone oven.</p>
        <a href="pizza.html" class="btn">View Pizza Menu</a>
      </div>
    </div>
  </div>

</body>
</html>
